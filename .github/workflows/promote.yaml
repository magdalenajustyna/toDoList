name: Control Canary Traffic

# Started manually: GitHub -> Actions -> "Control Canary Traffic" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What should happen?'
        type: choice
        options:
          - 'Increase traffic'
          - 'Rollback'
          - 'Show only'
        default: 'Show only'
      canary_tag:
        description: 'Canary tag from the deploy summary, e.g. canary-a1b2c3d (for "Increase traffic")'
      percent:
        description: 'Traffic share for the canary revision (for "Increase traffic")'
        type: choice
        options: ['10', '25', '50', '100']
        default: '10'
      rollback_revision:
        description: 'Revision to roll back to, e.g. todoapp-frontend-service-00006-xyz (for "Rollback")'

env:
  GCP_REGION: europe-west10
  SERVICE_NAME: todoapp-frontend-service

# Queue traffic changes instead of letting two runs overwrite each other.
concurrency:
  group: cloud-run-traffic

jobs:
  traffic:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        # -u aborts on a misspelled variable instead of passing an empty value to gcloud.
        shell: bash -eu {0}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Revision names for the rollback input, so the GCP console is not needed.
      - name: List existing revisions
        run: |
          gcloud run revisions list \
            --service="${SERVICE_NAME}" \
            --region="${GCP_REGION}" \
            --limit=10

      - name: Update traffic
        env:
          ACTION: ${{ inputs.action }}
          CANARY_TAG: ${{ inputs.canary_tag }}
          PERCENT: ${{ inputs.percent }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
        run: |
          case "$ACTION" in
            "Increase traffic")
              if [ -z "$CANARY_TAG" ]; then
                echo "Error: 'Increase traffic' requires a canary tag." >&2
                exit 1
              fi
              gcloud run services update-traffic "${SERVICE_NAME}" \
                --region="${GCP_REGION}" \
                --to-tags "${CANARY_TAG}=${PERCENT}"
              ;;

            "Rollback")
              if [ -z "$ROLLBACK_REVISION" ]; then
                echo "Error: 'Rollback' requires a revision name." >&2
                exit 1
              fi
              gcloud run services update-traffic "${SERVICE_NAME}" \
                --region="${GCP_REGION}" \
                --to-revisions "${ROLLBACK_REVISION}=100"
              ;;

            "Show only")
              echo "Nothing changed - only printing the current traffic split."
              ;;

            *)
              echo "Error: unknown action '$ACTION'." >&2
              exit 1
              ;;
          esac

      # always(): report the split even when the step above failed.
      - name: Show result
        if: always()
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region="${GCP_REGION}" --format=json > service.json

          {
            echo "## Traffic split"
            echo ""
            echo '```'
            jq -r '.status.traffic[] | "\(.revisionName)  \(.percent // 0) %  \(.tag // "")"' service.json
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
